name: fetch-audio
# Downloads a generated voice-over (e.g. ElevenLabs) into the repo so the reel builder can use it.
on:
  workflow_dispatch:
    inputs:
      url:
        description: "https URL of the audio file"
        required: true
      path:
        description: "repo path to save to, e.g. vo/2026-11-11_topic.mp3"
        required: true
permissions:
  contents: write
jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Download
        env:
          URL: ${{ inputs.url }}
          DEST: ${{ inputs.path }}
        run: |
          case "$DEST" in vo/*.mp3|vo/*.wav) ;; *) echo "path must be vo/*.mp3 or vo/*.wav"; exit 1;; esac
          case "$URL" in https://elevenlabsusercontent.com/*|https://storage.googleapis.com/eleven-*) ;; *) echo "only ElevenLabs URLs"; exit 1;; esac
          mkdir -p "$(dirname "$DEST")"
          curl -fsSL --max-time 120 -o "$DEST" "$URL"
          ls -la "$DEST"
      - name: Commit
        env:
          DEST: ${{ inputs.path }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add "$DEST"
          git commit -m "Add voice-over $DEST"
          git push
